<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>color proparty</title>
    <!--group selector me ham , deke ek hi style me multiple heading aur paragraph ko ek bar me select karke changes apply kar sakte hai-->
    <style>
        <!--class selector ko dot ke sath likhte hai-->
        #first_heading, .random_text{
            color: rgb(202, 26, 176);
        }
        
    </style>
</head>

<body>
    <h1 id="first_heading">this is a heading 1</h1>
    <p class="random_text">Lorem ipsum dolor sit amet consectetur adipisicing elit. Cumque facere provident in exercitationem tenetur asperiores consectetur aliquam tempore laudantium ab!</p>
    <h class="random_text">this is second heading</h>
    
</body>
</html>
