<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>position all proparty: static, relative, absolute, fixed</title>
    <style>
        .container{
            padding: 0px; margin: 0px;
        }
        .box1, .box2{
            position: absolute;
            border: solid black;
            width: 100px;
            height: 100px;
            text-align: center;
            font-size: 25px;
        }
        #box1{
            background-color: blue;
            left: 20px;
            top: 60px;
            z-index: 2;
        }
        #box2{
            background-color: aqua;
            left: 60px;
            top: 20px;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="container"></div>
        <div id="box1" class="box">Box1</div>
        <div id="box2" class="box">Box2</div>
    </div>
    
</body>
</html>
