<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>position all proparty: static, relative, absolute, fixed</title>
    <style>
        *{
            padding: 0px; margin: 0px;
        }
        .box{
            width: 50px;
            height: 50px;
            background-color: seagreen;
            margin: 5px;
        }
        #box1{
            position: static;
        }
        #box2{
            position: relative;
            top: 15px;
            left: 10px;
        }
        #box3{
            position: absolute;
            top: 20px;
        }
        #box4{
            position: fixed;
            right: 25;
        }
    </style>
</head>
<body>
    <div id="box1" class="box">Box1</div>
    <div id="box2" class="box">Box2</div>
    <div id="box3" class="box">Box3</div>
    <div id="box4" class="box">Box4</div>
    
</body>
</html>
