<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>relative unit: percentage</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            font-size: 5px;
        }
        #first{
            height: 100px;
            width: 200px;
            font-size: 20px;
            background-color: red;
            
        }
         #second{
            width: 50%;
            height: 50%;
            font-size: 2.5rem;
           background-color: royalblue;
         }
     </style>
     
</head>
<body>
    body text
    <div id="first">
        first div
        <div id="second">
        second div
        </div>
    </div>
</body>
</html>
