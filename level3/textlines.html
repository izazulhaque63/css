<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>text align</title>
    <style>
       #box1{text-decoration: underline;}
       #box1{text-decoration: overline;}
       #box3{text-decoration: line-through;}
        
    </style>
</head>
<body>
    <h3 id="box1" class="box">box1</h3>
    <h3 id="box1" class="box">box2</h3>
    <h3 id="box1" class="box">box3</h3> <hr>
    <a href="#">link1</a> <br>
    <a href="#" style="text-decoration: none;">link2</a>
     
</body>
</html>
