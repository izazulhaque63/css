<!DOCTYPE html>
<html lang="en">
<head>
    <!--grid ko ham multi direction me define kar sakte hai jab ki flex ko one dimension hota. grid me rows aur column define kar akte according to size
    grid multi dimension hota hai -->
    <title>grid</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        .box{
            height: 100px;
            width: 100px;
            border: 3px solid black;
            margin: 5px;
        }
        #heading {text-align: center;}
        #container {
            height: 600px;
            width: 600px;
           padding: 10px;
            margin: 20px;
            border: 3px solid black;
            background-color: lavender;

            display: grid;
            grid-template-columns: 80px 100px;
            grid-template-rows: 50px 100px;

        }
        
        #box1{ 
            grid-row: 1/ 2;
            grid-column: 1/2;
            background-color: aqua;
           
        }
        #box2{ 
            grid-row: 2/ 2;
            grid-column: 2/2;
            background-color: blueviolet;
          
        }
        #box3{ 
            grid-row: 2/ 2;
            grid-column: 1/2;
            background-color: yellow;
           
        }
        #box4{
            grid-row: 1/ 2;
            grid-column: 2/2;
            background-color: tomato;
           
        }
        
    </style>
</head>
<body>
    <h1 id = "heading">grid container</h1>
    <div id="container">
        <div id="box1" class="box">flex item 1</div>
        <div id="box2" class="box">flex item 2</div>
        <div id="box3" class="box">flex item 3</div>
        <div id="box4" class="box">flex item 4</div>
        
   </div>
    
</body>
</html>
