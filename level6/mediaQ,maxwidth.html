DOCTYPE html>
<html lang="en">
<head>
    
    <title>media queries (max-width)</title>
    <style>
        .box{
            padding: 5px;
            height: 100px;
            width: 100px;
            background-color: mediumseagreen;
        }
        /*max-width ka matlab jaise hai jab tak 250px ya us se kam tab tak condition meet karega screen size 50px aur jaise 250px cross kare 100px ho jayega normal
        ham @media use kare ke sare proparty use kar sakte hai like flexbox and etc.*/
        @media screen and (max-width: 250px) {
            .box{
                height: 150px;
                width: 150px;
            }
            
        }
    </style>
</head>
<body>
    <div class="box">Box</div>
</body>
</html>
