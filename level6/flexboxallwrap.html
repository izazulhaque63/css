<!DOCTYPE html>
<html lang="en">
<head>
    <!--flexbox container justify all flex wrap: no wrap, wrap, wrap reverse. -->
    <title>flexbox container(flex wrap)</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        .box{
            height: 150px;
            width: 150px;
            border: 3px solid black;
            margin: 5px;
        }
        #heading {text-align: center;}
        #container {
            height: 600px;
            width: 600px;
           padding: 10px;
            margin: 20px;
            border: 3px solid black;
            background-color: lavender;

            display: flex;
            justify-content: space-evenly;
            flex-wrap: wrap;
        }
        
        #box1{ background-color: aqua;}
        #box2{ background-color: blueviolet;}
        #box3{ background-color: yellow;}
        #box4{ background-color: tomato;}
        
    </style>
</head>
<body>
    <h1 id = "heading">flex container</h1>
    <div id="container">
        <div id="box1" class="box">flex item 1</div>
        <div id="box2" class="box">flex item 2</div>
        <div id="box3" class="box">flex item 3</div>
        <div id="box4" class="box">flex item 4</div>
        
   </div>
    
</body>
</html>
