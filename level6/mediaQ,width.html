<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>media queries (width)</title>
    <style>
        .box{
            padding: 5px;
            height: 100px;
            width: 100px;
            background-color: mediumseagreen;
        }
        @media screen and (width: 300px) {
            .box{background-color: brown;}
            
        }
    </style>
</head>
<body>
    <div class="box">Box</div>
</body>
</html>
