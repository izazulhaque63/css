<!DOCTYPE html>
<html lang="en">
<head>
    <!--flexbox item:ye special case of item means use hota hai kisi specific item ke center ko adjust karna ho ya align karna ho, use for only special item
    -->
    <title>flexbox item(align-self)</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        .box{
            height: 100px;
            width: 100px;
            border: 3px solid black;
            margin: 5px;
        }
        #heading {text-align: center;}
        #container {
            height: 600px;
            width: 600px;
           padding: 10px;
            margin: 20px;
            border: 3px solid black;
            background-color: lavender;

            display: flex;
            justify-content: center;
            align-items: center;

        }
        
        #box1{ background-color: aqua;}
        #box2{ 
            background-color: blueviolet;
            align-self: flex-end;
        }
        #box3{ background-color: yellow;}
        #box4{ background-color: tomato;}
        
    </style>
</head>
<body>
    <h1 id = "heading">flex container</h1>
    <div id="container">
        <div id="box1" class="box">flex item 1</div>
        <div id="box2" class="box">flex item 2</div>
        <div id="box3" class="box">flex item 3</div>
        <div id="box4" class="box">flex item 4</div>
        
   </div>
    
</body>
</html>
