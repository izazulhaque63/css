<!DOCTYPE html>
<html lang="en">
<head>
    <!--order use karte hai kisi bhi item ka order ko arrange ya change karne ke liye isko ham css se flex container ke andar change kar sakte hai.-->
    <title>flexbox item(order-)</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        .box{
            height: 100px;
            width: 100px;
            border: 3px solid black;
            margin: 5px;
        }
        #heading {text-align: center;}
        #container {
            height: 600px;
            width: 600px;
           padding: 10px;
            margin: 20px;
            border: 3px solid black;
            background-color: lavender;

            display: flex;
            justify-content: center;

        }
        
        #box1{ background-color: aqua;
            order: 3;
        }
        #box2{ 
            background-color: blueviolet;
            order: 4;
        }
        #box3{ background-color: yellow;
            order: 1;
        }
        #box4{ background-color: tomato;
            order: 2;
        }
        
    </style>
</head>
<body>
    <h1 id = "heading">flex container</h1>
    <div id="container">
        <div id="box1" class="box">flex item 1</div>
        <div id="box2" class="box">flex item 2</div>
        <div id="box3" class="box">flex item 3</div>
        <div id="box4" class="box">flex item 4</div>
        
   </div>
    
</body>
</html>
