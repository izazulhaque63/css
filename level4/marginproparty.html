<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>margin proparty</title>
    <style>
        * {
            margin: 0px;
            padding:0px;
        }
        .pad{
            height: 50px;
            width: 50px;
            padding: 2px;
        }
        #first{
           
            margin: 5px 5px 5px 5px;
            background-color: blueviolet;
        }
        #second{
            margin: 50px 5px 5px 5px;
            background-color: burlywood;
        }
    </style>
    
</head>
<body>
    <div id="first" class="pad">first</div>
    <div id="second" class="pad">second</div>
</body>
</html>
