<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>pseudo all classes: active, hover, pseudo.</title>
    <style>
        .pseudo{
              height: 25px;
              width: 150px;
              background-color: darkgreen;
              border: 2px solid black;
              border-radius: 10px;

        }
        .pseudo:hover{
             height: 30px;
             width: 160px;
             background-color: lightcoral;

        }
        .pseudo:active{
            height: 30px;
             width: 160px;
             background-color: red;
        }
    </style>
</head>
<body>
    <button class="pseudo">learning pseudo</button>
</body>
</html>
