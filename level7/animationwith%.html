<!DOCTYPE html>
<html lang="en">
<head>
    <title>animation:(using withaout from or to) using percentage% instead of from to</title>
    <style>
        .box {
            height: 70px;
            width: 70px;
            border: 2px solid black;
            border-radius: 5px;
            background-color: plum;
            position: relative;
            top: 10px;
            left: 10px;

            animation-name: ghumakkad;
            animation-duration: 2s;
            animation-timing-function: ease-in-out;
            animation-delay: 1s;

             animation-iteration-count: infinite;
              animation-direction: alternate;
            
        }
           /*using percentage% instead of from to*/
           
        @keyframes ghumakkad {
             0% {left: 10px;}
             50%{left: 50px;}
             60%{left: 160px;}
             100% {left: 200px; }
        }
    </style>
</head>
<body>
    <div class="box">animate</div>
</body>
</html>
