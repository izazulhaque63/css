<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>transition-all-proparty: timing, duration, delay, steps etc.</title>
    <style>
        .pseudo{
              height: 25px;
              width: 150px;
              background-color: darkgreen;
              border: 2px solid black;
              border-radius: 10px;
              
              transition-property: all;
              transition-duration: 1s;
              transition-timing-function: ease-in-out;
              transition-delay: 0s;
              /*  
              ham ek sath ek line me hi multiplt propart use kar sakte hai jaise ki upar ke 4 proparty ham ne 1 line me use kiya hai comment me.*/
               /*
              transition: all 1s ease-in-out 0s;
               */
        }
        .pseudo:hover{
             height: 30px;
             width: 160px;
             background-color: lightcoral;

        }
        .pseudo:active{
            height: 30px;
             width: 160px;
             background-color: red;
        }
    </style>
</head>
<body>
    <button class="pseudo">learning pseudo</button>
</body>
</html>
